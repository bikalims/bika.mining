name: Build and test bika.mining

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pyenv Python builds
        uses: actions/cache@v4
        with:
          path: ~/.pyenv
          key: pyenv-2.7.18-${{ runner.os }}
          restore-keys: |
            pyenv-2.7.18-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libssl-dev \
            zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            liblzma-dev libncurses-dev libxml2-dev libxslt1-dev libjpeg-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            poppler-utils fonts-liberation

      - name: Install pyenv
        run: |
          if [ ! -d "$HOME/.pyenv" ]; then
            curl https://pyenv.run | bash
          fi

      - name: Install Python 2.7 with pyenv
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          pyenv install --skip-existing 2.7.18
          pyenv global 2.7.18
          python --version

      - name: Cache eggs
        uses: actions/cache@v4
        with:
          key: eggs-cache-${{ hashFiles('ci.cfg', 'ci-requirements.txt', 'setup.py') }}
          path: eggs/

      - name: Install dependencies and build test runner
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          python -m pip install -r ci-requirements.txt
          mkdir -p downloads
          buildout -N -t 60 -c ci.cfg

      - name: Lint
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          flake8 --config ci_flake8.cfg src/bika/mining setup.py

      - name: Run tests
        run: bin/test -s bika.mining.tests --exit-with-status

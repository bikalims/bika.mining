name: Build and test bika.mining

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYENV_ROOT: ${{ runner.temp }}/pyenv
      TZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libssl-dev \
            zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            liblzma-dev libncurses-dev libxml2-dev libxslt1-dev libjpeg-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            poppler-utils fonts-liberation

      - name: Install pyenv
        run: |
          git clone --depth 1 https://github.com/pyenv/pyenv.git "$PYENV_ROOT"
          echo "$PYENV_ROOT/bin" >> "$GITHUB_PATH"
          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

      - name: Cache Python 2.7
        uses: actions/cache@v4
        with:
          path: ${{ env.PYENV_ROOT }}/versions/2.7.18
          key: python-2.7.18-ubuntu22.04-${{ runner.arch }}-v1

      - name: Set up Python 2.7
        run: |
          pyenv install --skip-existing 2.7.18
          pyenv global 2.7.18
          python --version
          python -c 'import ssl, sqlite3, bz2, zlib'

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            eggs
            downloads
          key: ubuntu22.04-py27-buildout-${{ hashFiles('ci.cfg', 'ci-requirements.txt', 'setup.py') }}

      - name: Install Python dependencies
        run: python -m pip install -r ci-requirements.txt

      - name: Build test runner
        run: |
          mkdir -p downloads
          buildout -N -t 60 -c ci.cfg

      - name: Lint
        run: flake8 --config ci_flake8.cfg src/bika/mining setup.py

      - name: Run unit and integration tests
        run: bin/test -s bika.mining.tests --exit-with-status

[buildout]
extends = https://dist.plone.org/release/5.2.15/versions.cfg
index = https://pypi.org/simple/
find-links =
    https://dist.plone.org/release/5.2.15/
    https://dist.plone.org/thirdparty/
    https://github.com/collective/plone.jsonapi.core/releases/download/0.8.0/plone.jsonapi.core-0.8.0.tar.gz
parts = test
develop = .
extensions = mr.developer
sources = sources
auto-checkout = *
versions = versions
show-picked-versions = true
download-cache = downloads

# Match the SENAITE stack used by the mining installation. The development
# sources are deliberately not cached, so branch updates are tested each run.
[sources]
senaite.core = git https://github.com/bikalims/senaite.core.git branch=results-report
senaite.lims = git https://github.com/senaite/senaite.lims.git rev=0e487baf128dbfd9444048334ffa6f176b0dd8d2
senaite.app.listing = git https://github.com/senaite/senaite.app.listing.git rev=5c60e0afdce6e73ca898c358ef0004ff5d38f4cc
senaite.app.spotlight = git https://github.com/senaite/senaite.app.spotlight.git rev=6212658fbafae22d1f74dee5ca1e1745098af0b4
senaite.app.supermodel = git https://github.com/senaite/senaite.app.supermodel.git rev=03cc81a7d799135d19676129d30a8ca6512777a8
senaite.impress = git https://github.com/senaite/senaite.impress.git rev=ed7b6bca59e3c79b2778ff2ecad4dcf7c20aa351
senaite.jsonapi = git https://github.com/senaite/senaite.jsonapi.git rev=2.6.0
senaite.sampleimporter = git https://github.com/bikalims/senaite.sampleimporter.git branch=main

[test]
recipe = zc.recipe.testrunner
eggs =
    bika.mining[test]
    senaite.core[test]
    senaite.lims
    senaite.app.listing
    senaite.app.spotlight
    senaite.app.supermodel
    senaite.impress
    senaite.jsonapi
    senaite.sampleimporter
defaults = ['-s', 'bika.mining.tests', '--auto-color', '--auto-progress']
initialization =
    import os
    os.environ['TZ'] = 'UTC'

[versions]
# Supplied by ci-requirements.txt.
setuptools =
zc.buildout =
plone.jsonapi.core = 0.8.0
